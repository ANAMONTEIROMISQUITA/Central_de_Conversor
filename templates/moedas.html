<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas</title>

    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Conversor de Moedas</h1>

        <form method="POST">

            <label for="valor">Valor:</label>

            <input
                type="number"
                id="valor"
                name="valor"
                step="0.01"
                placeholder="Digite um valor"
                required
            >

            <label for="conversao">Conversão:</label>

            <select id="conversao" name="conversao">

                <option value="real_dolar">
                    Real → Dólar
                </option>

                <option value="dolar_real">
                    Dólar → Real
                </option>

            </select>

            <button type="submit" class="botao">
                Converter
            </button>

        </form>

        {% if resultado is not none %}

            <div class="resultado">
                Resultado: {{ "%.2f"|format(resultado) }}
            </div>

        {% endif %}

        <a href="/" class="voltar">
            ← Voltar
        </a>

    </div>

</body>

</html>
